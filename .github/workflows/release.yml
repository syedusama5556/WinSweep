name: Release

# The version comes from the app itself: <Version> in TempCleanerWinUI.csproj,
# which tests/Test-Version.ps1 keeps in step with the Win32 and console builds.
# Bump that one number, push to main, and this publishes the release.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build/**"
      - "tests/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Republish even if a release for this version already exists"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    name: Read the version from the app
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      needed: ${{ steps.read.outputs.needed }}
    steps:
      - uses: actions/checkout@v4

      - name: Read <Version> and decide whether to publish
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/winui/TempCleanerWinUI.csproj)
          if [ -z "$version" ]; then
            echo "No <Version> found in TempCleanerWinUI.csproj" >&2
            exit 1
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.force }}" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild of $tag."
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already released. Bump <Version> to publish a new one."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "$tag has no release yet, building it."
          fi

  release:
    name: Build, package and publish
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Check every build reports the same version
        shell: pwsh
        run: .\tests\Test-Version.ps1

      - name: Build native scanner and Win32 app (MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          call build\build-native.bat || exit /b 1
          call build\build-win32-msvc.bat || exit /b 1

      - name: Build WinUI 3 app
        shell: cmd
        run: dotnet build src\winui -c Release -r win-x64

      - name: Run the test suite
        shell: pwsh
        run: |
          .\tests\Test-NativeScanner.ps1
          .\tests\Test-Catalog.ps1

      - name: Package
        shell: pwsh
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          $tag = $env:TAG
          New-Item -ItemType Directory release -Force | Out-Null

          # WinUI: the whole folder, self contained, no runtime needed.
          $winui = "src\winui\bin\Release\net9.0-windows10.0.26100.0\win-x64"
          Copy-Item README.md, LICENSE $winui
          Compress-Archive -Path "$winui\*" -DestinationPath "release\WinSweep-WinUI-$tag-win-x64.zip"

          # Win32: one exe, no runtime at all.
          New-Item -ItemType Directory staging\win32 -Force | Out-Null
          Copy-Item dist\TempCleanerPro.exe, README.md, LICENSE staging\win32
          Compress-Archive -Path "staging\win32\*" -DestinationPath "release\WinSweep-Win32-$tag.zip"

          # Console: the script, its icon and the shortcut helper.
          New-Item -ItemType Directory staging\console -Force | Out-Null
          Copy-Item src\batch\TempCleaner.bat, src\batch\TempCleaner.ico, `
                    src\batch\Create-Shortcut.ps1, README.md, LICENSE staging\console
          Compress-Archive -Path "staging\console\*" -DestinationPath "release\WinSweep-Console-$tag.zip"

          Get-FileHash release\*.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content release\SHA256SUMS.txt -Encoding ascii

          Get-ChildItem release | Format-Table Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Write the release notes
        shell: pwsh
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          $tag = $env:TAG
          @"
          ## WinSweep $tag

          Pick what goes. Watch it go.

          ### Downloads

          | File | What it is | Needs |
          |---|---|---|
          | ``WinSweep-WinUI-$tag-win-x64.zip`` | The full Fluent app. Unzip anywhere and run ``TempCleanerWinUI.exe``. | Windows 10 1809+. Self contained: no .NET install, no MSIX, no Developer Mode. |
          | ``WinSweep-Win32-$tag.zip`` | Single-file Win32 app, about 330 KB. | Windows 7+. No runtime. |
          | ``WinSweep-Console-$tag.zip`` | The console version, plus its icon and a shortcut helper. | Any Windows with cmd. |

          Verify a download against ``SHA256SUMS.txt``:

          ``````powershell
          Get-FileHash .\WinSweep-WinUI-$tag-win-x64.zip -Algorithm SHA256
          ``````

          ### Reminders

          - Nothing is scanned until you press **Measure sizes**, and nothing is deleted until you press **Clean**.
          - Rows marked **Risk** are never ticked by a preset other than Deep, and the confirmation dialog names every one.
          - Run as administrator to include system locations such as ``C:\Windows\Temp`` and the Windows Update cache.

          Full catalogue and usage notes: [the wiki](https://github.com/${{ github.repository }}/wiki).
          "@ | Set-Content release\NOTES.md -Encoding utf8

      - name: Tag the commit
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          $tag = $env:TAG
          if (gh release view $tag 2>$null) { gh release delete $tag --yes --cleanup-tag:$false }
          gh release create $tag `
            --title "WinSweep $tag" `
            --notes-file release\NOTES.md `
            release\WinSweep-WinUI-$tag-win-x64.zip `
            release\WinSweep-Win32-$tag.zip `
            release\WinSweep-Console-$tag.zip `
            release\SHA256SUMS.txt
